services:
  - type: web
    name: claude-lens-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd "phase 4/src" && uvicorn claude_lens.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.11"
