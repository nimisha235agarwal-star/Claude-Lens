services:
  - type: web
    name: claude-lens-backend
    env: python
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONPATH
        value: "./phase 4/src:./phase 3/src"
